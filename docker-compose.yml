# Whisper service: N API replicas behind one nginx address. Each replica runs the model in its own process,
# so RAM use is per replica; the downloaded weights are shared through the models volume.
# Start:  docker compose up -d --build          (callers use http://<host>:29300)
# Scale:  SERVICE_REPLICAS=3 docker compose up -d --build, then: docker compose restart stt_whisper_model_lb

name: stt_whisper_model

services:
  stt_whisper_model:
    build: .
    image: stt_whisper_model:latest
    restart: unless-stopped
    mem_limit: ${SERVICE_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    environment:
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-}
      SERVICE_NUM_THREAD: ${SERVICE_NUM_THREAD:-}
      SERVICE_REPLICAS: ${SERVICE_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - stt_whisper_model_models:/models
      - stt_whisper_model_data:/data
    deploy:
      replicas: ${SERVICE_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29300/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [stt_whisper_model]

  stt_whisper_model_lb:
    container_name: stt_whisper_model_lb
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-29300}:29300"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      stt_whisper_model:
        condition: service_healthy
    networks:
      stt_whisper_model:
      citadel:
        aliases: [stt_whisper_model_lb]

volumes:
  stt_whisper_model_models:
    name: stt_whisper_model_models
  stt_whisper_model_data:
    name: stt_whisper_model_data
networks:
  # Other stacks reach http://stt_whisper_model_lb:29300 by joining this network.
  stt_whisper_model:
    name: stt_whisper_model
  citadel:
    name: citadel_core
    external: true
