# Load balancer in front of the stt_whisper_model replicas. Docker DNS gives `stt_whisper_model` one address per replica;
# nginx reads them at start, so restart this container after changing the replica count.
upstream stt_whisper_model {
    least_conn;
    server stt_whisper_model:29300 max_fails=2 fail_timeout=10s;
}

server {
    listen 29300;
    client_max_body_size 32m;  # 900 s of 16 kHz PCM, the largest max_seconds

    location / {
        proxy_pass http://stt_whisper_model;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Internal-Token $http_x_internal_token;
        proxy_read_timeout 130s;
        # A chat is a pure function of its body, so another replica may repeat it after a connection error.
        proxy_next_upstream error http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
