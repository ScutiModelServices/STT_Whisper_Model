[project]
name = "stt_whisper_model"
description = "One HTTP service that runs the Whisper speech-to-text model (faster-whisper) on the CPU, or an NVIDIA GPU with the `gpu` extra, for every project"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
# NVIDIA libraries CTranslate2 needs on a GPU (about 1.1 GB); `uv sync --extra gpu`. Not needed on a CPU.
gpu = ["nvidia-cublas-cu12==12.6.4.1", "nvidia-cudnn-cu12>=9,<10"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.40"]

[tool.uv]
package = false  # runs from src/, only the dependencies are installed

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true  # runs from src/, installs only the dependencies

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
